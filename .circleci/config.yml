version: 2.1

orbs:
    python: circleci/python@1.2.1

jobs:
    build-and-test:
        executor: python/default
        steps:
            - checkout
            - python/install-packages:
                pkg-manager: pip
            - python/install-packages:
                args: pytest
                pkg-manager: pip
                pypi-cache: false
            - run:
                command: |
                    pytest test_main.py
                name: Test
workflows:
    main:
        jobs:
            - build-and-test
